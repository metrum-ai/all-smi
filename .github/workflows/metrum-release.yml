#
# Metrum fork release builder. Linux on ARC DOKS, macOS ARM64 hosted — no
# Windows/Intel-Mac signing hosts, Apple notarization, Homebrew/PPA/Teams.
# Do not publish a public tag until after P4 (real GPM + DCGM plugin).
# Tags use a metrum suffix (e.g. v0.26.3-metrum.1) so they never collide
# with lablup/all-smi release tags.
name: Metrum Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build from AND upload artifacts to (e.g. v0.26.3-metrum.1). Empty = build the dispatched ref."
        required: false
      targets:
        description: "Platform families (comma-separated: linux, macos, or all). Empty = all."
        required: false
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  setup:
    name: Resolve build matrix
    runs-on: all-smi-arc
    outputs:
      includes: ${{ steps.resolve.outputs.includes }}
    steps:
      - name: Install matrix resolver prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Resolve target platforms
        id: resolve
        env:
          TARGETS: ${{ github.event_name == 'release' && 'all' || github.event.inputs.targets }}
        run: |
          set -euo pipefail
          ALL='[
            {"os_family":"linux", "target":"x86_64-unknown-linux-gnu",  "os":"all-smi-arc",      "artifact_name":"all-smi", "asset_name":"all-smi-linux-x86_64",      "archive_ext":".tar.gz", "protoc_platform":"linux-x86_64"},
            {"os_family":"linux", "target":"x86_64-unknown-linux-musl", "os":"all-smi-arc",      "artifact_name":"all-smi", "asset_name":"all-smi-linux-x86_64-musl", "archive_ext":".tar.gz", "protoc_platform":"linux-x86_64"},
            {"os_family":"linux", "target":"aarch64-unknown-linux-gnu", "os":"all-smi-arc",   "artifact_name":"all-smi", "asset_name":"all-smi-linux-aarch64",     "archive_ext":".tar.gz", "protoc_platform":"linux-x86_64"},
            {"os_family":"macos", "target":"aarch64-apple-darwin",      "os":"macos-15",           "artifact_name":"all-smi", "asset_name":"all-smi-macos-aarch64",     "archive_ext":".zip",    "protoc_platform":"osx-aarch_64"}
          ]'
          sel="$(printf '%s' "${TARGETS:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -z "$sel" ]; then sel="all"; fi
          fams=""
          IFS=','
          for tok in $sel; do
            case "$tok" in
              all) fams="linux macos" ;;
              linux|macos) fams="$fams $tok" ;;
              "") ;;
              *) echo "::error::Unknown build target '$tok'. Allowed: linux, macos, all."; exit 1 ;;
            esac
          done
          unset IFS
          fam_json="$(printf '%s\n' $fams | awk 'NF' | sort -u | jq -R . | jq -cs .)"
          includes="$(printf '%s' "$ALL" | jq -c --argjson fams "$fam_json" \
            '[ .[] | select(.os_family as $f | $fams | index($f)) ]')"
          if [ "$(printf '%s' "$includes" | jq 'length')" -eq 0 ]; then
            echo "::error::No build targets selected."; exit 1
          fi
          echo "Building families: $fam_json"
          printf '%s' "$includes" | jq -r '.[] | "  - " + .target'
          echo "includes=$includes" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.includes) }}
    env:
      PROTOC_VERSION: "31.1"
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout code
        # Pinned: fork org requires full-length commit SHAs (not floating tags).
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.release_tag || github.sha }}

      - name: Checkout workflow actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          path: .workflow-actions

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: metrum-${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            metrum-${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Add target architecture
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt update
          sudo apt install -y musl-tools

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils build-essential curl gcc-aarch64-linux-gnu jq pkg-config libdrm-dev libdrm-amdgpu1

      # protoc executes on the ARC x86_64 host, even for the ARM64 target.
      - name: Install ARM64 DRM cross-link libraries
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$ID" = ubuntu
          ROOT="$RUNNER_TEMP/arm64-drm"
          mkdir -p "$ROOT/lists/partial" "$ROOT/debs" "$ROOT/sysroot"
          printf 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports %s main universe\n' \
            "$VERSION_CODENAME" "${VERSION_CODENAME}-updates" "${VERSION_CODENAME}-security" > "$ROOT/sources.list"
          OPTS=(-o APT::Architecture=arm64 -o APT::Architectures=arm64
            -o "Dir::Etc::sourcelist=$ROOT/sources.list" -o Dir::Etc::sourceparts=-
            -o "Dir::State::lists=$ROOT/lists" -o Dir::Cache::pkgcache= -o Dir::Cache::srcpkgcache=)
          sudo apt-get "${OPTS[@]}" update
          cd "$ROOT/debs"
          apt-get "${OPTS[@]}" download libdrm-dev:arm64 libdrm2:arm64 libdrm-amdgpu1:arm64
          for package in *.deb; do dpkg-deb -x "$package" "$ROOT/sysroot"; done
          for library in libdrm.so libdrm_amdgpu.so; do
            resolved="$(realpath -e "$ROOT/sysroot/usr/lib/aarch64-linux-gnu/$library")"
            case "$resolved" in "$ROOT/sysroot/"*) ;; *) echo "Library escaped sysroot: $resolved"; exit 1 ;; esac
            aarch64-linux-gnu-readelf -h "$resolved" | grep -q 'Machine:.*AArch64'
          done
          PKG_CONFIG_SYSROOT_DIR="$ROOT/sysroot" \
            PKG_CONFIG_LIBDIR="$ROOT/sysroot/usr/lib/aarch64-linux-gnu/pkgconfig" \
            pkg-config --cflags --libs libdrm libdrm_amdgpu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-Lnative=$ROOT/sysroot/usr/lib/aarch64-linux-gnu"
            echo "PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu=$ROOT/sysroot"
            echo "PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu=$ROOT/sysroot/usr/lib/aarch64-linux-gnu/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS_aarch64_unknown_linux_gnu=1"
          } >> "$GITHUB_ENV"

      - name: Setup protoc
        uses: ./.workflow-actions/.github/actions/setup-protoc
        with:
          version: ${{ env.PROTOC_VERSION }}
          platform: ${{ matrix.protoc_platform }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked -p all-smi

      - name: Build AMD runtime plugin (Linux glibc only)
        if: runner.os == 'Linux' && !contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          echo "AMD_PLUGIN_BUILT=false" >> "$GITHUB_ENV"
          if [ ! -f crates/all-smi-amd-plugin/Cargo.toml ]; then
            exit 0
          fi
          cargo build --release --target ${{ matrix.target }} --locked -p all-smi-amd-plugin
          test -f "target/${{ matrix.target }}/release/liball_smi_amd.so"
          echo "AMD_PLUGIN_BUILT=true" >> "$GITHUB_ENV"

      - name: Build DCGM runtime plugin (Linux glibc only)
        if: runner.os == 'Linux' && !contains(matrix.target, 'musl')
        run: |
          set -euo pipefail
          echo "DCGM_PLUGIN_BUILT=false" >> "$GITHUB_ENV"
          if [ ! -f crates/all-smi-dcgm-plugin/Cargo.toml ]; then
            exit 0
          fi
          cargo build --release --target ${{ matrix.target }} --locked -p all-smi-dcgm-plugin
          test -f "target/${{ matrix.target }}/release/liball_smi_dcgm.so"
          echo "DCGM_PLUGIN_BUILT=true" >> "$GITHUB_ENV"

      - name: Verify ARM64 binary and plugin architecture
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in all-smi liball_smi_amd.so liball_smi_dcgm.so; do
            aarch64-linux-gnu-readelf -h "target/${{ matrix.target }}/release/$artifact" | grep -q 'Machine:.*AArch64'
          done

      - name: Package Linux binary (tar.gz)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p package
          cp "$BIN_DIR/${{ matrix.artifact_name }}" package/
          if [ "${AMD_PLUGIN_BUILT:-false}" = true ]; then
            cp "$BIN_DIR/liball_smi_amd.so" package/
          fi
          if [ "${DCGM_PLUGIN_BUILT:-false}" = true ]; then
            cp "$BIN_DIR/liball_smi_dcgm.so" package/
          fi
          if [ -f docs/man/all-smi.1 ]; then
            cp docs/man/all-smi.1 package/
          fi
          tar -C package -czf ${{ matrix.asset_name }}.tar.gz .

      - name: Package macOS binary (zip, unsigned)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          mkdir -p package
          cp "$BIN" package/
          chmod +x "package/${{ matrix.artifact_name }}"
          if [ -f docs/man/all-smi.1 ]; then
            cp docs/man/all-smi.1 package/
          fi
          ditto -c -k --sequesterRsrc package ${{ matrix.asset_name }}.zip

      - name: Generate checksum
        run: |
          set -euo pipefail
          FILE="${{ matrix.asset_name }}${{ matrix.archive_ext }}"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sha256sum "$FILE" > "$FILE.sha256"
          else
            shasum -a 256 "$FILE" > "$FILE.sha256"
          fi

      - name: Upload release artifacts
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
          files: |
            ${{ matrix.asset_name }}${{ matrix.archive_ext }}
            ${{ matrix.asset_name }}${{ matrix.archive_ext }}.sha256
