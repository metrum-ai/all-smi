name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'screenshots/**'
      - 'scripts/check-doc-links.py'
      - 'scripts/tests/test_doc_links.py'
      - 'scripts/requirements-docs.txt'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'screenshots/**'
      - 'scripts/check-doc-links.py'
      - 'scripts/tests/test_doc_links.py'
      - 'scripts/requirements-docs.txt'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  links:
    name: Documentation links
    runs-on: all-smi-arc
    steps:
      - name: Install documentation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl python3 python3-pip
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-docs.txt
      - run: python -m pytest scripts/tests
      - run: python scripts/check-doc-links.py
