name: Shadeform GPU Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadeform-gpu-validation
  cancel-in-progress: false

jobs:
  gpu-validation:
    name: Shadeform NVIDIA GPU Validation
    if: github.ref == 'refs/heads/main'
    runs-on: all-smi-arc
    timeout-minutes: 60
    steps:
      - name: Install Shadeform runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq openssh-client python3 python3-venv

      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify secrets and install the Shadeform SSH key
        shell: bash
        env:
          SHADEFORM_API_KEY: ${{ secrets.SHADEFORM_API_KEY }}
          SHADEFORM_SSH_PRIVATE_KEY: ${{ secrets.SHADEFORM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadeform-gpu-raw"
          chmod 700 "$RUNNER_TEMP/shadeform-gpu-raw"
          if [[ -z "$SHADEFORM_API_KEY" ]]; then
            echo "::error::Configure the SHADEFORM_API_KEY repository secret; no instance was created."
            exit 1
          fi
          if [[ -z "$SHADEFORM_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Configure the SHADEFORM_SSH_PRIVATE_KEY repository secret; no instance was created."
            exit 1
          fi
          umask 077
          printf '%s' "$SHADEFORM_SSH_PRIVATE_KEY" > .shadeform_ed25519
          chmod 600 .shadeform_ed25519
          ssh-keygen -y -f .shadeform_ed25519 > .shadeform_ed25519.pub
          chmod 600 .shadeform_ed25519.pub

      - name: Run GPU validation (maximum $3/hour, 50-minute step limit)
        timeout-minutes: 50
        shell: bash
        env:
          SHADEFORM_API_KEY: ${{ secrets.SHADEFORM_API_KEY }}
        run: |
          set -euo pipefail
          scripts/dev/shadeform-gpu-validation.sh "$RUNNER_TEMP/shadeform-gpu-raw"

      # The orchestrator also has an EXIT trap. This second cleanup path covers
      # cancellation or a failure before the orchestrator starts.
      - name: Delete any remaining Shadeform instance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadeform-gpu-raw"
          chmod 700 "$RUNNER_TEMP/shadeform-gpu-raw"
          if [[ -f .shadeform-state.json ]]; then
            python3 scripts/dev/shadeform.py delete --yes-i-am-sure \
              > "$RUNNER_TEMP/shadeform-gpu-raw/workflow-delete.raw" 2>&1
          else
            python3 scripts/dev/shadeform.py status \
              > "$RUNNER_TEMP/shadeform-gpu-raw/workflow-delete-status.raw" 2>&1
          fi
          if [[ -f .shadeform-state.json ]]; then
            echo "::error::Shadeform instance state remains after cleanup."
            exit 1
          fi
        env:
          SHADEFORM_API_KEY: ${{ secrets.SHADEFORM_API_KEY }}

      - name: Redact validation logs
        if: always()
        shell: bash
        env:
          SHADEFORM_API_KEY: ${{ secrets.SHADEFORM_API_KEY }}
          SHADEFORM_SSH_PRIVATE_KEY: ${{ secrets.SHADEFORM_SSH_PRIVATE_KEY }}
        run: |
          python3 scripts/dev/redact-gpu-logs.py \
            "$RUNNER_TEMP/shadeform-gpu-raw" "$RUNNER_TEMP/shadeform-gpu-redacted"

      - name: Upload redacted GPU evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shadeform-gpu-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shadeform-gpu-redacted/
          if-no-files-found: error
          retention-days: 14
