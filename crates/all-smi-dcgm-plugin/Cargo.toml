[package]
name = "all-smi-dcgm-plugin"
version = "0.28.1"
description = "Runtime-loaded DCGM backend for all-smi (dlopen libdcgm; does not link into the main binary)"
authors = ["Metrum AI <engineering@metrum.ai>"]
license = "Apache-2.0"
repository = "https://github.com/metrum-ai/all-smi"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "all_smi_dcgm"
crate-type = ["cdylib"]

[dependencies]
all-smi = { path = "../..", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
libc = "0.2"
libloading = "0.9"
